<main class="booking-page"><div class="container"><div class="breadcrumb">Beranda / Booking</div><div class="booking-grid"><section><span class="section-kicker">BOOKING PERJALANAN</span><h1>Siap <strong>berangkat?</strong></h1><p class="muted">Lengkapi data di bawah untuk membuat permintaan booking.</p><div class="form-card"><form id="bookingForm"><label>Nama lengkap<input id="name" required placeholder="Masukkan nama lengkap"></label><label>Nomor WhatsApp<input id="phone" required inputmode="tel" placeholder="08xxxxxxxxxx"></label><label>Email <span>(opsional)</span><input id="email" type="email" placeholder="nama@email.com"></label><label>Paket wisata<select id="package" required><option value="">Pilih paket</option><option>Bali Escape</option><option>Jogja Stories</option><option>Lombok Wild</option></select></label><label>Provinsi keberangkatan<select id="origin" required><option value="">Pilih provinsi</option><option>Sumatera Utara</option><option>Sumatera Barat</option><option>Riau</option><option>Kepulauan Riau</option><option>Jambi</option><option>Sumatera Selatan</option><option>Bengkulu</option><option>Lampung</option><option>DKI Jakarta</option><option>Jawa Barat</option><option>Jawa Tengah</option><option>DI Yogyakarta</option><option>Jawa Timur</option><option>Banten</option><option>Bali</option><option>Nusa Tenggara Barat</option><option>Nusa Tenggara Timur</option><option>Kalimantan Barat</option><option>Kalimantan Tengah</option><option>Kalimantan Selatan</option><option>Kalimantan Timur</option><option>Kalimantan Utara</option><option>Sulawesi Utara</option><option>Sulawesi Tengah</option><option>Sulawesi Selatan</option><option>Sulawesi Tenggara</option><option>Gorontalo</option><option>Maluku</option><option>Maluku Utara</option><option>Papua</option><option>Papua Barat</option><option>Provinsi Indonesia lainnya</option></select></label><label>Jumlah orang<input id="guests" type="number" min="1" max="30" value="2" required></label><label>Tanggal
