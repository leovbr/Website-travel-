<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WANDER — Booking</title><link rel="stylesheet" href="style.css"></head><body><header class="nav dark"><a class="brand" href="index.html">WANDER<span>.</span></a><a class="nav-cta" href="index.html">← Kembali</a></header><main class="booking standalone"><div><p class="eyebrow">BOOKING INDONESIA</p><h1>Rencanakan<br><em>perjalananmu.</em></h1><p>Isi data berikut. Permintaan akan dibuatkan kode booking untuk proses konfirmasi admin.</p></div><form id="bookingForm"><label>Nama lengkap<input id="name" required></label><label>WhatsApp<input id="phone" required inputmode="tel"></label><label>Email<input id="email" type="email"></label><label>Paket<select id="package" required><option value="">Pilih paket</option><option>Bali Escape</option><option>Jogja Stories</option><option>Lombok Wild</option></select></label><label>Provinsi keberangkatan<select id="origin" required><option value="">Pilih provinsi</option><option>Sumatera Utara</option><option>Sumatera Barat</option><option>Riau</option><option>DKI Jakarta</option><option>Jawa Barat</option><option>Jawa Tengah</option><option>DI Yogyakarta</option><option>Jawa Timur</option><option>Bali</option><option>Nusa Tenggara Barat</option><option>Kalimantan Timur</option><option>Sulawesi Selatan</option><option>Provinsi Indonesia lainnya</option></select></label><label>Jumlah orang<input id="guests" type="number" min="1" max="30" value="2" required></label><label>Tanggal berangkat<input id="date" type="date" required></label><button class="submit" type="submit">Buat booking <span>→</span></button><p class="form-status" id="status"></p></form></main><script src="script.js"></script></body></html>
